<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frost Camp — Coldvain</title>
<meta name="description" content="Frost Camp: buduj obóz ocalałych i broń go przed hordami potworów w 6 światach.">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 40px 20px;
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #e8f2ff;
    background: radial-gradient(ellipse at 50% 35%, #173156 0%, #0a1528 55%, #04080f 100%); }
  h1 { font-size: clamp(38px, 11vw, 74px); line-height: .9; margin: 0; letter-spacing: .02em; }
  h1 span { display: block; }
  h1 .a { background: linear-gradient(180deg, #fff 10%, #bfeaff 55%, #4fb0ea 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  h1 .b { font-size: .8em; background: linear-gradient(180deg, #ffe58a, #f0a020); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p.tag { color: #a9c6e2; margin: 18px 0 34px; }
  a { color: #7fc4f5; }
  .links { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .links a { display: inline-block; padding: 11px 22px; border-radius: 12px; background: #1d2e4d; text-decoration: none; color: #dbeeff; }
  .links a:hover { background: #274067; }
  footer { margin-top: 48px; font-size: 12px; letter-spacing: .25em; color: rgba(190,220,250,.5); }
</style>
</head>
<body>
<main>
  <h1><span class="a">FROST</span><span class="b">CAMP</span></h1>
  <p class="tag">Buduj obóz. Przetrwaj hordy.</p>
  <div class="links">
    <a href="privacy-policy.html">Polityka prywatności</a>
    <a href="https://github.com/OrderGlide/game">Kod źródłowy</a>
  </div>
  <footer>COLDVAIN</footer>
</main>
</body>
</html>
